<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marinduque Travel Checklist</title>
</head>
<body>
  <main>
    <h1>Marinduque Travel Checklist</h1>
    <ul>
      <li>
        <input type="checkbox" id="check-sun-protection">
        <label for="check-sun-protection">
          <strong>Pack sun protection</strong> — <span>Travel Essentials</span><br>
          Bring sun protection for time spent outdoors.
        </label>
      </li>
      <li>
        <input type="checkbox" id="check-travel-updates">
        <label for="check-travel-updates">
          <strong>Check travel updates before setting out</strong> — <span>Travel Preparation</span><br>
          Confirm your transport plans and check for updates before you leave.
        </label>
      </li>
      <li>
        <input type="checkbox" id="check-natural-places">
        <label for="check-natural-places">
          <strong>Leave natural places as you found them</strong> — <span>Responsible Tourism</span><br>
          Take your rubbish with you and avoid disturbing wildlife.
        </label>
      </li>
      <li>
        <input type="checkbox" id="check-photo-permission">
        <label for="check-photo-permission">
          <strong>Ask before taking someone’s photo</strong> — <span>Cultural Awareness</span><br>
          Respect people’s privacy by asking for permission first.
        </label>
      </li>
    </ul>
  </main>
</body>
</html>
